# valkiriacloud.com (dominio raiz) -> landing page
server {
    server_name valkiriacloud.com www.valkiriacloud.com;
    root /var/www/valkiria;
    index index.html;
    location / { try_files $uri $uri/ =404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/valkiriacloud.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/valkiriacloud.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.valkiriacloud.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = valkiriacloud.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name valkiriacloud.com www.valkiriacloud.com;
    return 404; # managed by Certbot




}